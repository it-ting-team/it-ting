# dev에 프론트엔드 변경이 병합되면 목 사이트(Vercel)를 다시 배포한다.
# 프론트엔드만 올리고 모든 데이터는 브라우저 안의 목 서버가 준다(deploy/mock/frontend.build.env).
# Vercel이 저장소를 직접 보게 연결하지 않고, 여기서 빌드한 결과를 Vercel CLI로 올린다.
# Vercel 프로젝트 만들기와 필요한 시크릿: docs/infra/test-server.md의 "목 사이트"
name: deploy-mock

on:
  push:
    branches: [dev]
    paths:
      - "frontend/**"
      - "deploy/mock/**"
      - ".github/workflows/deploy-mock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 새 커밋이 오면 앞의 배포를 취소하고 가장 최근 것만 올린다.
  group: deploy-mock
  cancel-in-progress: true

jobs:
  deploy:
    name: Vercel에 배포
    # dev 브랜치에서만 돈다(수동 실행도).
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_CLI_VERSION: 66.6.0
      # 목 사이트의 주소(Vercel 프로젝트 이름으로 정해진다). 알림에 적는다.
      MOCK_SITE_URL: https://diguldigul-mock.vercel.app
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: 시크릿 확인
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::시크릿 VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID가 필요합니다. docs/infra/test-server.md"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: 목 사이트 빌드 값 넣기
        # Next가 빌드할 때 .env.production.local을 읽어 NEXT_PUBLIC_* 값을 JS에 박는다.
        run: cp ../deploy/mock/frontend.build.env .env.production.local
      - name: Vercel CLI 설치
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: 프로젝트 설정 받기
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: 빌드
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: 올리기
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Discord로 결과 알리기
        # 성공과 실패를 배포 채널로 알린다. 새 커밋이 와서 취소된 실행은 알리지 않는다.
        if: ${{ !cancelled() }}
        env:
          DISCORD_WEBHOOK_DEPLOY_URL: ${{ secrets.DISCORD_WEBHOOK_DEPLOY_URL }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_DEPLOY_URL" ]; then
            echo "::warning::시크릿 DISCORD_WEBHOOK_DEPLOY_URL이 없어 알림을 보내지 않습니다. docs/infra/test-server.md"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            head="✅ **목 사이트 배포 성공**"
          else
            head="❌ **목 사이트 배포 실패**"
          fi
          # 병합 커밋이면 첫 줄("Merge pull request …") 대신 그 아래의 PR 제목을 쓴다.
          title=$(printf '%s\n' "$COMMIT_MESSAGE" | awk 'NR == 1 { first = $0; next } NF { print; found = 1; exit } END { if (!found) print first }')
          content="${head}
          주소: ${MOCK_SITE_URL}
          커밋: ${COMMIT_SHA:0:7} ${title}
          실행한 사람: ${ACTOR}
          ${RUN_URL}"
          payload=$(jq -n --arg content "$content" \
            '{content: $content, allowed_mentions: {parse: []}}')
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_DEPLOY_URL"
