# dev에 프론트엔드 변경이 병합되면 목 사이트(Vercel)를 다시 배포한다.
# 프론트엔드만 올리고 모든 데이터는 브라우저 안의 목 서버가 준다(deploy/mock/frontend.build.env).
# Vercel이 저장소를 직접 보게 연결하지 않고, 여기서 빌드한 결과를 Vercel CLI로 올린다.
# Vercel 프로젝트 만들기와 필요한 시크릿: docs/infra/test-server.md의 "목 사이트"
name: deploy-mock

on:
  push:
    branches: [dev]
    paths:
      - "frontend/**"
      - "deploy/mock/**"
      - ".github/workflows/deploy-mock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 새 커밋이 오면 앞의 배포를 취소하고 가장 최근 것만 올린다.
  group: deploy-mock
  cancel-in-progress: true

jobs:
  deploy:
    name: Vercel에 배포
    # dev 브랜치에서만 돈다(수동 실행도).
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_CLI_VERSION: 66.6.0
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: 시크릿 확인
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::시크릿 VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID가 필요합니다. docs/infra/test-server.md"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: 목 사이트 빌드 값 넣기
        # Next가 빌드할 때 .env.production.local을 읽어 NEXT_PUBLIC_* 값을 JS에 박는다.
        run: cp ../deploy/mock/frontend.build.env .env.production.local
      - name: Vercel CLI 설치
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: 프로젝트 설정 받기
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: 빌드
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: 올리기
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
