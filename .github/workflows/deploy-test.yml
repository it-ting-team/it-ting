# test 브랜치에 병합되면 테스트 서버(GCP)에 프론트엔드와 백엔드를 배포한다.
# 검사 → 이미지 둘을 GHCR에 올림 → 서버가 받아 다시 띄움 → 주소로 확인.
# 서버 구성, 필요한 시크릿, 되돌리는 법: docs/infra/test-server.md
name: deploy-test

on:
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "되돌릴 때만 적는다: 이미 올라간 이미지의 커밋 SHA(40자). 비우면 test의 지금 커밋을 새로 빌드해 배포한다"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # 배포는 한 번에 하나씩 차례로 한다. 도는 중인 배포를 끊지 않는다.
  group: deploy-test
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/it-ting-team/it-ting-backend
  FRONTEND_IMAGE: ghcr.io/it-ting-team/it-ting-frontend

jobs:
  build:
    name: 검사 · 이미지
    # test 브랜치에서만 돈다(수동 실행도). 되돌리기(image_tag를 적음)면 건너뛴다.
    if: github.ref == 'refs/heads/test' && !inputs.image_tag
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # 백엔드: 테스트 전체가 통과해야 한다. build가 실행 jar(build/libs/app.jar)도 만든다.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: 백엔드 빌드와 테스트
        working-directory: backend
        run: ./gradlew build

      # 프론트엔드: 타입 검사와 단위 테스트. 배포 빌드는 이미지를 만들 때 돈다.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프론트엔드 타입 검사와 단위 테스트
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: GHCR 로그인
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: 백엔드 이미지 만들어 올리기
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${BACKEND_IMAGE}:${GITHUB_SHA}" \
            --tag "${BACKEND_IMAGE}:test" \
            backend
          docker push --all-tags "${BACKEND_IMAGE}"
      - name: 프론트엔드 이미지 만들어 올리기
        run: |
          docker build \
            --build-context buildenv=deploy/test \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${FRONTEND_IMAGE}:${GITHUB_SHA}" \
            --tag "${FRONTEND_IMAGE}:test" \
            frontend
          docker push --all-tags "${FRONTEND_IMAGE}"

  deploy:
    name: 서버에 배포
    needs: build
    # 이미지를 새로 만들었거나(success), 되돌리기라 건너뛰었을 때(skipped)만 배포한다.
    if: always() && github.ref == 'refs/heads/test' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      TEST_HOST: ${{ vars.TEST_HOST }}
      SSH_USER: ${{ secrets.TEST_SSH_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: 값 확인
        run: |
          if ! printf '%s' "$IMAGE_TAG" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::image_tag는 커밋 SHA 40자여야 합니다."
            exit 1
          fi
          if [ -z "$TEST_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::error::변수 TEST_HOST와 시크릿 TEST_SSH_USER가 필요합니다. docs/infra/test-server.md"
            exit 1
          fi
      - name: SSH 준비
        env:
          SSH_KEY: ${{ secrets.TEST_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host test-server"
            echo "  HostName ${TEST_HOST}"
            echo "  User ${SSH_USER}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config
      - name: 배포 설정(deploy/)을 서버로 복사
        # 서버의 .env는 저장소에 없으므로 덮어쓰지 않는다. 목 사이트용 폴더는 서버에 필요 없다.
        run: |
          tar -C deploy --exclude=./mock -czf - . \
            | ssh test-server 'mkdir -p /opt/it-ting && tar -C /opt/it-ting -xzf -'
      - name: 서버가 이미지를 받아 다시 띄우기
        # IMAGE_TAG는 위에서 SHA 40자인지 확인한 값이다. 여기서 풀어 서버 명령에 넣는다.
        run: |
          # shellcheck disable=SC2029
          ssh test-server "IMAGE_TAG=${IMAGE_TAG} bash /opt/it-ting/deploy.sh"
      - name: 주소로 확인
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${TEST_HOST}/actuator/health"
          echo
          curl --fail --silent --show-error --output /dev/null --retry 6 --retry-delay 10 --retry-all-errors \
            "https://${TEST_HOST}/"
          echo "https://${TEST_HOST} 에 배포했습니다 (이미지 ${IMAGE_TAG})."

  notify:
    name: Discord 알림
    needs: [build, deploy]
    # 배포를 시도한 실행의 결과를 배포 채널로 알린다. 취소한 실행과 test가 아닌 브랜치의 실행은 알리지 않는다.
    if: ${{ !cancelled() && github.ref == 'refs/heads/test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 배포 결과 보내기
        env:
          DISCORD_WEBHOOK_DEPLOY_URL: ${{ secrets.DISCORD_WEBHOOK_DEPLOY_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          TEST_HOST: ${{ vars.TEST_HOST }}
          ROLLBACK_TAG: ${{ inputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_DEPLOY_URL" ]; then
            echo "::warning::시크릿 DISCORD_WEBHOOK_DEPLOY_URL이 없어 알림을 보내지 않습니다. docs/infra/test-server.md"
            exit 0
          fi
          if [ "$DEPLOY_RESULT" = "success" ]; then
            head="✅ **테스트 서버 배포 성공**"
          elif [ "$BUILD_RESULT" = "failure" ]; then
            head="❌ **테스트 서버 배포 실패** (검사 · 이미지 단계, 서버는 그대로)"
          else
            head="❌ **테스트 서버 배포 실패** (서버에 배포 단계)"
          fi
          if [ -n "$ROLLBACK_TAG" ]; then
            what="되돌리기: 이미지 ${ROLLBACK_TAG:0:7}"
          else
            # 병합 커밋이면 첫 줄("Merge pull request …") 대신 그 아래의 PR 제목을 쓴다.
            title=$(printf '%s\n' "$COMMIT_MESSAGE" | awk 'NR == 1 { first = $0; next } NF { print; found = 1; exit } END { if (!found) print first }')
            what="커밋: ${COMMIT_SHA:0:7} ${title}"
          fi
          content="${head}
          주소: https://${TEST_HOST}
          ${what}
          실행한 사람: ${ACTOR}
          ${RUN_URL}"
          payload=$(jq -n --arg content "$content" \
            '{content: $content, allowed_mentions: {parse: []}}')
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_DEPLOY_URL"
