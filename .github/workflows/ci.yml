# PR마다 빌드 · 테스트와 저장소 규칙을 검사한다. 검사 목록과 실패했을 때 고치는 법은 docs/ci.md.
# 결과는 마지막 요약 job `ci` 하나로 모은다. 필수 검사로 걸 때도 `ci`만 건다. 건너뛴 job은 통과로 본다.
name: ci

on:
  pull_request:
    branches: [dev, test, main]
  push:
    # dev에 병합된 뒤에도 백엔드를 다시 빌드한다. 실패하면 Discord로 알린다.
    branches: [dev]

permissions:
  contents: read

concurrency:
  # 같은 PR에 새 커밋이 오면 이전 실행을 취소한다. dev 푸시는 커밋마다 따로 돈다.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: 바뀐 곳 찾기
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE_SHA}...HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            range="${PUSH_BEFORE}...HEAD"
          fi
          files=$(git diff --name-only "$range")
          echo "바뀐 파일:"
          echo "$files"
          if echo "$files" | grep -qE '^(backend/|\.github/workflows/)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          # Docker 이미지와 배포 설정에 영향을 주는 파일
          if echo "$files" | grep -qE '^(deploy/|backend/(Dockerfile|\.dockerignore|build\.gradle)$|frontend/(Dockerfile|\.dockerignore|next\.config\.ts|package\.json|package-lock\.json)$|\.github/workflows/)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: 백엔드 빌드 · 테스트
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          # 캐시는 dev에서만 쓴다. PR은 dev의 캐시를 읽기만 한다.
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
      - name: 빌드와 테스트 (Testcontainers로 MySQL · Redis)
        run: ./gradlew build
      - name: 실패하면 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7
      - name: dev에서 실패하면 Discord로 알리기
        if: failure() && github.event_name == 'push'
        working-directory: .
        env:
          DISCORD_WEBHOOK_PR_URL: ${{ secrets.DISCORD_WEBHOOK_PR_URL }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          content="❌ **dev 백엔드 빌드 실패**
          커밋: ${COMMIT_SHA:0:7} ${title}
          ${RUN_URL}"
          payload=$(jq -n --arg content "$content" \
            '{content: $content, allowed_mentions: {parse: []}}')
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_PR_URL"

  docker:
    # 테스트 서버에 올릴 이미지가 만들어지는지, 배포 설정이 맞는지 본다. 올리지는 않는다(올리는 것은 deploy-test.yml).
    name: Docker 이미지 · 배포 설정
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: 백엔드 jar
        working-directory: backend
        run: ./gradlew bootJar
      - name: 백엔드 이미지
        run: docker build --tag it-ting-backend:ci backend
      - name: 프론트엔드 이미지
        run: docker build --build-context buildenv=deploy/test --tag it-ting-frontend:ci frontend
      - name: Compose 설정
        env:
          # 검사용 값. 실제 값은 서버의 .env에만 있다.
          TEST_HOST: test.example.com
          TEST_MAIL_HOST: mail-test.example.com
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: itting
          MYSQL_USER: itting
          MYSQL_PASSWORD: ci
          MAILPIT_UI_AUTH: "ci:ci"
        run: |
          docker compose -f deploy/test/compose.yaml config --quiet
          docker compose -f deploy/edge/compose.yaml config --quiet
      - name: Caddyfile
        run: |
          docker run --rm \
            -e TEST_HOST=test.example.com -e TEST_MAIL_HOST=mail-test.example.com \
            -v "$PWD/deploy/edge/caddy:/etc/caddy:ro" \
            caddy:2.11 caddy validate --config /etc/caddy/Caddyfile
      - name: 배포 스크립트 문법
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/setup-server.sh
          bash -n deploy/set-env.sh

  merge-flow:
    name: 병합 흐름
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/ci/check-merge-flow.sh "$BASE_REF" "$HEAD_REF"

  migrations:
    name: 마이그레이션 보호
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/check-migrations.sh "$PR_BASE_SHA"

  secrets:
    name: 비밀값
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks 설치
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$file" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
      - name: PR의 새 커밋 검사
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --config .gitleaks.toml \
            --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}" \
            --redact --verbose --no-banner

  skills-sync:
    name: 스킬 동기화
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 원본(.agents/skills)과 사본(.claude/skills) 비교
        run: |
          if ! diff -r .agents/skills .claude/skills; then
            echo "::error::.agents/skills와 .claude/skills가 다릅니다. 원본을 고친 뒤 'bash scripts/sync-agent-skills.sh'를 실행하세요."
            exit 1
          fi

  ci:
    # 요약. 위 job이 모두 통과하거나 건너뛰었을 때만 통과한다.
    name: ci
    if: always()
    needs: [changes, backend, docker, merge-flow, migrations, secrets, skills-sync]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null \
            || { echo "::error::실패하거나 취소된 검사가 있습니다. 위 결과를 보세요."; exit 1; }
