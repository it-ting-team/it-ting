name: agent-skills-sync

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".claude/skills/**"

permissions:
  contents: read

jobs:
  check:
    # 스킬 원본(.agents/skills)과 Claude Code용 사본(.claude/skills)이 같은지 확인한다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 원본과 사본 비교
        run: |
          if ! diff -r .agents/skills .claude/skills; then
            echo "::error::.agents/skills와 .claude/skills가 다릅니다. 원본을 고친 뒤 'bash scripts/sync-agent-skills.sh'를 실행하세요."
            exit 1
          fi
