# 모든 프로필에 공통인 설정
# 프로필: local(내 PC), test(테스트 서버), prod(운영 서버)
# 프로필을 고르지 않고 실행하면 local로 뜬다.

spring:
  application:
    name: it-ting
  profiles:
    default: local
  jpa:
    # 테이블은 Flyway 마이그레이션(db/migration)만 만든다. 엔티티와 테이블이 다르면 서버가 뜨지 않는다.
    hibernate:
      ddl-auto: validate
    # 요청이 끝날 때까지 DB 연결을 붙잡지 않는다. 조회는 서비스 안에서 끝낸다.
    open-in-view: false
    properties:
      hibernate:
        # 시각은 Instant로 다뤄 UTC로 저장한다. Instant가 아닌 시각 타입을 쓰더라도 UTC로 저장되게 맞춘다.
        jdbc:
          time_zone: UTC
  web:
    # 검증 오류의 설명(error.fields[].message)을 요청의 Accept-Language와 상관없이 한국어로 준다.
    locale: ko_KR
    locale-resolver: fixed
    resources:
      # 정적 파일을 주지 않는 API 서버다. 끄면 없는 주소가 메서드와 상관없이 404로 답한다(켜 두면 POST가 405가 된다).
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
