# 모든 프로필에 공통인 설정
# 프로필: local(내 PC), test(테스트 서버), prod(운영 서버)
# 프로필을 고르지 않고 실행하면 local로 뜬다.

spring:
  application:
    name: it-ting
  profiles:
    default: local
  flyway:
    # 마이그레이션 번호는 만든 시각이다(AGENTS.md의 DB). 여러 사람이 동시에 작업하면 먼저 만든 마이그레이션이
    # 나중에 병합될 수 있으므로, 이미 적용된 것보다 번호가 작아도 실행한다.
    out-of-order: true
  jpa:
    # 테이블은 Flyway 마이그레이션(db/migration)만 만든다. 엔티티와 테이블이 다르면 서버가 뜨지 않는다.
    hibernate:
      ddl-auto: validate
    # 요청이 끝날 때까지 DB 연결을 붙잡지 않는다. 조회는 서비스 안에서 끝낸다.
    open-in-view: false
    properties:
      hibernate:
        # 시각은 Instant로 다뤄 UTC로 저장한다. Instant가 아닌 시각 타입을 쓰더라도 UTC로 저장되게 맞춘다.
        jdbc:
          time_zone: UTC
  web:
    # 검증 오류의 설명(error.fields[].message)을 요청의 Accept-Language와 상관없이 한국어로 준다.
    locale: ko_KR
    locale-resolver: fixed
    resources:
      # 정적 파일을 주지 않는 API 서버다(올린 사진의 /images/**만 ImageResourceConfig가 준다).
      # 끄면 없는 주소가 메서드와 상관없이 404로 답한다(켜 두면 POST가 405가 된다).
      add-mappings: false
  servlet:
    multipart:
      # 사진은 한 번에 한 장, 5MB까지다(docs/api/08-community.md의 사진 올리기). 넘으면 400 INVALID_INPUT이다.
      max-file-size: 5MB
      max-request-size: 6MB
  session:
    # 로그인 세션은 Redis에 두고, 마지막으로 쓴 뒤 14일이 지나면 사라진다(요청할 때마다 다시 14일).
    # 세션 쿠키 ITTING_SESSION의 속성은 SessionCookieConfig에 있다.
    timeout: 14d
    data:
      redis:
        # 계정 id로 세션을 찾을 수 있게 색인한다. 비밀번호를 재설정하면 그 계정의 세션을 모두 지운다.
        repository-type: indexed

management:
  endpoints:
    web:
      exposure:
        include: health

# 서비스 설정
itting:
  # 회원가입과 추천 친구 설정에서 고를 수 있는 기수. 인증 코드를 보낼 Mattermost가 연결된 기수만 둔다.
  generations: 15, 16
  cors:
    # 쿠키를 실어 API를 부를 수 있는 프론트엔드 출처. 프로필마다 정한다.
    allowed-origins: []
  # 이메일 · SSAFY 인증 코드와 가입 진행 기록(docs/api/02-auth.md)
  verification:
    code-ttl: 5m
    resend-interval: 60s
    # 이만큼 틀리면 코드를 지운다. 그 뒤로는 VERIFICATION_CODE_EXPIRED다.
    max-attempts: 5
    signup-ttl: 1h
  mail:
    # 인증 메일의 보내는 사람. 프로필마다 정한다.
    from: no-reply@itting.local
  # 브라우저 푸시(VAPID). 키는 backend/에서 ./gradlew vapidKeys로 만들어 넣는다. 모든 프로필에서
  # 환경 변수 ITTING_PUSH_*를 읽는다(local은 .env). 이름에 하이픈이 있어 자동 연결이 안 되므로 여기서 직접 잇는다.
  # 세 값 가운데 하나라도 비어 있으면 서버는 정상으로 뜨고 푸시만 보내지 않는다.
  push:
    # 브라우저가 푸시 구독을 만들 때 쓰는 공개 키(알림 설정이 준다). 공개해도 되는 값이다. 비어 있으면 알림 설정이 null을 준다.
    public-key: ${ITTING_PUSH_PUBLIC_KEY:}
    # 푸시에 서명하는 개인 키. 비밀값이라 .env나 환경 변수에만 두고 공유하지 않는다.
    private-key: ${ITTING_PUSH_PRIVATE_KEY:}
    # 푸시 서비스가 문제를 알릴 연락처. mailto:팀주소 형식
    subject: ${ITTING_PUSH_SUBJECT:}
  # Google 로그인 · 연동(docs/api/02-auth.md, docs/api/10-settings.md). OAuth 클라이언트는 Google Cloud 콘솔에서 사람이
  # 만들어 값을 .env나 환경 변수 ITTING_GOOGLE_*로 넣는다. 이름에 하이픈이 있어 자동 연결이 안 되므로 여기서 직접 잇는다.
  # 값이 비어 있어도 서버는 정상으로 뜨고, Google이 거절해 로그인 · 확인이 실패로 끝난다(따로 검사하지 않는다).
  google:
    client-id: ${ITTING_GOOGLE_CLIENT_ID:}
    # 비밀값이라 .env나 환경 변수에만 두고 공유하지 않는다.
    client-secret: ${ITTING_GOOGLE_CLIENT_SECRET:}
    # Google이 브라우저를 돌려보낼 콜백의 전체 주소. Google Cloud 콘솔의 "승인된 리디렉션 URI"와 같아야 한다.
    redirect-uri: ${ITTING_GOOGLE_REDIRECT_URI:}
    # 아래 셋은 Google의 주소다. 가짜 Google 서버로 바꿔 볼 때만 덮어쓴다.
    authorization-uri: ${ITTING_GOOGLE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
    token-uri: ${ITTING_GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    userinfo-uri: ${ITTING_GOOGLE_USERINFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
  # 비밀번호 재설정 링크(docs/api/02-auth.md)
  password-reset:
    link-ttl: 30m
    # 같은 이메일로 이 간격 안에 다시 요청하면 메일을 보내지 않는다(응답은 같다).
    request-interval: 60s
  # 올린 사진(POST /api/v1/images)을 두는 서버의 폴더와 사진 주소의 앞부분. 비어 있으면 서버가 뜨지 않는다.
  # 사진은 <public-base-url>/images/2026/11/<UUID>.webp로 받는다(로그인 없이). 폴더는 서버를 다시 띄워도 남아 있어야 한다.
  # 이름에 하이픈이 있어 환경 변수가 자동으로 연결되지 않으므로 여기서 직접 잇는다(local은 기본값이 있다).
  images:
    storage-dir: ${ITTING_IMAGES_STORAGE_DIR:}
    public-base-url: ${ITTING_IMAGES_PUBLIC_BASE_URL:}
  # 실시간 소식 연결(docs/api/06-chat.md의 GET /api/v1/me/event-stream)
  event-stream:
    # 연결을 유지하려고 주석 줄(:ping)을 보내는 간격. 조용한 연결을 끊는 프록시보다 짧게 둔다.
    # 브라우저가 끊은 연결은 이 신호를 쓰다 실패해 지워지므로, 길게 잡으면 끊긴 연결이 그만큼 오래 남는다.
    heartbeat-interval: 25s
  # 서버가 사용자를 보내는 프론트엔드 주소(재설정 링크, Google 로그인 뒤)는 프로필마다 itting.frontend-url로 정한다.
  mattermost:
    # 기수: 그 기수 Mattermost 서버의 Incoming Webhook URL 목록. 프로필마다 .env나 환경 변수로 넣는다.
    webhooks: {}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
