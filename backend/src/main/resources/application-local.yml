# 내 PC에서 개발할 때
# DB는 저장소 루트의 compose.yaml로 띄운 MySQL을 쓴다(docker compose up -d).
# 접속 값은 저장소 루트의 .env에서 읽는다. backend/에서 실행하든 루트에서 실행하든 찾는다.

spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:itting}
    # 사용자와 비밀번호는 기본값 없이 .env에서만 읽는다.
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      port: ${REDIS_PORT:6379}

itting:
  cors:
    allowed-origins: http://localhost:3000

management:
  endpoint:
    health:
      show-details: always
