# 내 PC에서 개발할 때
# DB는 저장소 루트의 compose.yaml로 띄운 MySQL을 쓴다(docker compose up -d).
# 접속 값은 저장소 루트의 .env에서 읽는다. backend/에서 실행하든 루트에서 실행하든 찾는다.

spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:itting}
    # 사용자와 비밀번호는 기본값 없이 .env에서만 읽는다.
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      port: ${REDIS_PORT:6379}
  # 메일은 compose의 Mailpit이 받는다. 받은 메일은 http://localhost:8025
  mail:
    host: localhost
    port: ${MAILPIT_SMTP_PORT:1025}

itting:
  cors:
    allowed-origins: http://localhost:3000
  mattermost:
    # 값은 .env에 사용자가 넣는다(쉼표로 여러 개). 비어 있으면 그 기수로는 보내지 못하고 503이다.
    webhooks:
      15: ${MATTERMOST_WEBHOOK_URLS_15:}
      16: ${MATTERMOST_WEBHOOK_URLS_16:}

management:
  endpoint:
    health:
      show-details: always
