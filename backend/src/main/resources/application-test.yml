# 테스트 서버
# 서버 주소, DB 접속 값 같은 것은 배포 환경을 정한 뒤 환경 변수로 넣는다.
# DB: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# Redis: SPRING_DATA_REDIS_HOST, SPRING_DATA_REDIS_PORT, SPRING_DATA_REDIS_PASSWORD
# 프론트엔드 출처(CORS): ITTING_CORS_ALLOWED_ORIGINS
# 메일(없으면 서버가 뜨지 않는다): SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, ITTING_MAIL_FROM
# Mattermost 웹후크(기수별, 쉼표로 여러 개): ITTING_MATTERMOST_WEBHOOKS_15, ITTING_MATTERMOST_WEBHOOKS_16

management:
  endpoint:
    health:
      show-details: never
