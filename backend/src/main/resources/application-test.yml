# 테스트 서버(GCP). 구성과 운영 방법은 docs/infra/test-server.md
# 서버 주소, DB 접속 값 같은 것은 환경 변수로 넣는다(deploy/test/compose.yaml이 서버의 .env에서 읽어 넣는다).
# DB: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# Redis: SPRING_DATA_REDIS_HOST, SPRING_DATA_REDIS_PORT, SPRING_DATA_REDIS_PASSWORD
# 프론트엔드 출처(CORS): ITTING_CORS_ALLOWED_ORIGINS
# 프론트엔드 주소(재설정 링크 등, 없으면 서버가 뜨지 않는다): ITTING_FRONTEND_URL
# 메일(없으면 서버가 뜨지 않는다): SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, ITTING_MAIL_FROM
# Mattermost 웹후크(기수별, 쉼표로 여러 개): ITTING_MATTERMOST_WEBHOOKS_15, ITTING_MATTERMOST_WEBHOOKS_16
# Google OAuth 클라이언트(없으면 Google 로그인 · 연동만 실패한다): ITTING_GOOGLE_CLIENT_ID, ITTING_GOOGLE_CLIENT_SECRET, ITTING_GOOGLE_REDIRECT_URI(콜백의 전체 주소)
# 브라우저 푸시 키(없으면 푸시만 보내지 않는다. ./gradlew vapidKeys로 만든다): ITTING_PUSH_PUBLIC_KEY, ITTING_PUSH_PRIVATE_KEY, ITTING_PUSH_SUBJECT(mailto:팀주소)
# 올린 사진(서버를 다시 띄워도 남는 폴더, 사진 주소의 앞부분. 없으면 서버가 뜨지 않는다): ITTING_IMAGES_STORAGE_DIR, ITTING_IMAGES_PUBLIC_BASE_URL

server:
  # HTTPS는 앞단 프록시(Caddy)가 받고 서버에는 HTTP로 넘긴다. 프록시가 붙인 X-Forwarded-* 헤더로
  # 원래 요청의 주소와 https 여부를 알아본다. 서버 포트는 밖으로 열지 않으므로 이 헤더는 프록시만 보낼 수 있다.
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: never
